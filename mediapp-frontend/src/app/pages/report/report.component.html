<button mat-flat-button (click)="change('line')">Line</button>
<button mat-flat-button (click)="change('bar')">Bar</button>
<button mat-flat-button (click)="change('doughnut')">Doughnut</button>
<button mat-flat-button (click)="change('radar')">Radar</button>
<button mat-flat-button (click)="change('pie')">Pie</button>

<div [hidden]="!$chart()">
    <canvas id="canvas"></canvas>
</div>


<mat-divider></mat-divider>

<button mat-flat-button (click)="viewReport()">View Report PDF</button>
<button mat-flat-button (click)="downloadReport()">Download Report PDF</button>

@if ($pdfSrc()) {
    <pdf-viewer [src]="$pdfSrc()" [render-text]="true" style="display: block;" style="width: 800px; height: 800px;"></pdf-viewer>
}
